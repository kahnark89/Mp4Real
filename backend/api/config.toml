# arcshield-mcp/config.toml
# ============================================================
# ArcShield MCP Server Configuration
# ============================================================
# To swap storage backends: change backend_type and update the
# corresponding [backend.*] section. No other files change.

[server]
name        = "arcshield-mcp"
facility_id = "HOLLOWELL_PPVC1"
allow_writes = true   # set false on read-only remote deployments

[backend]
# Phase 1: flat JSON files. Switch to "sqlite" or "neo4j" when ready.
# get_backend() in arcshield/corpus/backends/__init__.py handles routing.
type = "json"

[backend.json]
corpus_dir = "./corpus"

# [backend.sqlite]           # Phase 2 — uncomment when SqliteCorpusBackend exists
# db_path = "./corpus.db"

# [backend.neo4j]            # Phase 3 — uncomment when GraphCorpusBackend exists
# uri      = "bolt://localhost:7687"
# username = "neo4j"
# password = "REPLACE_ME"

[auth]
# Per-operator write authorization (MCP-MOD-004).
# When write_operators is present and non-empty, ingest_event and
# update_graph_weight verify that event.operator_id / updated_by appears
# in this list before touching the backend. Empty list = no restriction.
# Values are the operator_id hashes used in CIAER+ event records.
# Phase 3 upgrade path: replace list lookup with signed-token verification
# once MCP header support lands upstream.
write_operators = ["op_hash_abc123"]   # seed operator from April 8 PIE demo
