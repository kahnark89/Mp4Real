# arcshield-mcp/config.toml
# ============================================================
# ArcShield MCP Server Configuration
# ============================================================
# To swap storage backends: change backend_type and update the
# corresponding [backend.*] section. No other files change.

[server]
name        = "arcshield-mcp"
facility_id = "HOLLOWELL_PPVC1"
allow_writes = true   # set false on read-only remote deployments

[backend]
# Phase 2: SQLite with indexed columns and value-proximity scoring.
# get_backend() in arcshield/corpus/backends/__init__.py handles routing.
type = "sqlite"

[backend.json]
corpus_dir = "./corpus"

[backend.sqlite]
db_path = "./corpus.db"

# [backend.neo4j]            # Phase 3 — uncomment when GraphCorpusBackend exists
# uri      = "bolt://localhost:7687"
# username = "neo4j"
# password = "REPLACE_ME"

[ogc]
# OGC learning rate α (CLAUDE.md §6.1). Controls how fast R_phys updates graph_weight.
# new_weight = graph_weight + α * (R_phys - graph_weight) * compliance_gate
# Default 0.1: moderate update. Lower for stability in sparse corpus; raise at Phase 4.
alpha = 0.1

[auth]
# Per-operator write authorization (MCP-MOD-004).
# When write_operators is present and non-empty, ingest_event and
# update_graph_weight verify that event.operator_id / updated_by appears
# in this list before touching the backend. Empty list = no restriction.
# Values are the operator_id hashes used in CIAER+ event records.
# Phase 3 upgrade path: replace list lookup with signed-token verification
# once MCP header support lands upstream.
write_operators = ["op_hash_abc123", "op_hash_kc_7a3f2b"]   # seed + April 8 PIE demo operator

[codebook]
# Path to the hand-curated primitives JSON file (FIG. 8, CLAUDE.md §5.1).
# Relative paths are resolved relative to this config file (same rule as corpus_dir).
# Omit this section to use the package default (backend/codebook/primitives.json).
path = "../codebook/primitives.json"
