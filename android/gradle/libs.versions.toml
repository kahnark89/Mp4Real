[versions]
agp                  = "8.3.2"
kotlin               = "2.0.21"
coreKtx              = "1.13.1"
coroutines           = "1.8.1"
rxjava3              = "3.1.9"
polarBle             = "5.3.1"
junit                = "4.13.2"
cameraX              = "1.3.4"
kotlinxSerialization = "1.7.3"
composeBom           = "2024.09.00"
lifecycleVm          = "2.8.4"
activityCompose      = "1.9.1"

[libraries]
androidx-core-ktx           = { group = "androidx.core",              name = "core-ktx",                    version.ref = "coreKtx"    }
kotlinx-coroutines-core     = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-core",     version.ref = "coroutines" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-android",  version.ref = "coroutines" }
kotlinx-coroutines-rx3      = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-rx3",      version.ref = "coroutines" }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-test",     version.ref = "coroutines" }
rxjava3                     = { group = "io.reactivex.rxjava3",        name = "rxjava",                      version.ref = "rxjava3"    }
polar-ble-sdk               = { group = "com.github.polarofficial",    name = "polar-ble-sdk",               version.ref = "polarBle"   }
junit                       = { group = "junit",                       name = "junit",                       version.ref = "junit"      }
camerax-core                = { group = "androidx.camera",             name = "camera-core",                 version.ref = "cameraX"    }
camerax-camera2             = { group = "androidx.camera",             name = "camera-camera2",              version.ref = "cameraX"    }
camerax-lifecycle           = { group = "androidx.camera",             name = "camera-lifecycle",            version.ref = "cameraX"    }
kotlinx-serialization-json  = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",  version.ref = "kotlinxSerialization" }
compose-bom                 = { group = "androidx.compose",            name = "compose-bom",                 version.ref = "composeBom" }
compose-ui                  = { group = "androidx.compose.ui",         name = "ui"                                                     }
compose-material3           = { group = "androidx.compose.material3",  name = "material3"                                              }
compose-ui-tooling-preview  = { group = "androidx.compose.ui",         name = "ui-tooling-preview"                                     }
compose-material-icons-core = { group = "androidx.compose.material",   name = "material-icons-core"                                    }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose", version.ref = "lifecycleVm" }
activity-compose            = { group = "androidx.activity",           name = "activity-compose",            version.ref = "activityCompose" }

[plugins]
android-application  = { id = "com.android.application",                   version.ref = "agp"    }
android-library      = { id = "com.android.library",                       version.ref = "agp"    }
kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
