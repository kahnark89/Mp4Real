# Project-wide Gradle settings for the ArcShield Android build.

# AndroidX is required — every dependency in this project is an AndroidX/Jetpack artifact.
# Without this the AGP build fails at configuration.
android.useAndroidX=true

kotlin.code.style=official

# Modest heap suited to a resource-constrained laptop. Raise to 3-4g only if the
# Kotlin/KSP daemon OOMs during a clean build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Reuse build outputs across runs; helps repeat builds on limited hardware.
org.gradle.caching=true
